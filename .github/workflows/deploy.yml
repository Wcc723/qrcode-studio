name: Deploy to Cloudflare Workers
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        # 版本讀 .nvmrc，避免第二個事實來源。不能低於 22：wrangler 4 要求 Node >= 22，
        # 用 20 會在部署那步直接被擋下（build 與測試卻是綠的，很難察覺）。
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run test
      # 子路徑網址的唯一事實來源在 scripts/gen-sitemap.mjs，這裡刻意不再用
      # SITE_URL 覆蓋（兩個事實來源時，改了檔案卻沒改 CI 會靜默產出舊網域的 sitemap）。
      - run: npm run build
      - run: npm run seo:audit
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 必須釘版本：wrangler-action@v3 預設會自己裝 wrangler 3.90.0，而 3.x 不支援
          # 「只有靜態資產、沒有 main 進入點」的 Worker，會直接報 Missing entry-point。
          # 這個 repo 從 2026-06-01 起每次 CI 部署都因此失敗（線上跑的是更早的手動部署）。
          # 版本與 package-lock.json 鎖的 wrangler 對齊，升級時兩處要一起改。
          wranglerVersion: '4.95.0'
          # build 已在前一步跑過，這裡只做部署
          command: deploy
